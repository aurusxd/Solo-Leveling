name: life-rpg

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-life_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-life_rpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${IMAGE:?IMAGE is set by the deploy job}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-life_rpg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-life_rpg}
    depends_on:
      postgres:
        condition: service_healthy

  # One-off job run by deploy.sh before the app restarts; the profile keeps `up` from starting it.
  migrate:
    image: ${IMAGE:?IMAGE is set by the deploy job}:${IMAGE_TAG:-latest}
    profiles: ['tools']
    command: ['node', 'scripts/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-life_rpg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-life_rpg}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
